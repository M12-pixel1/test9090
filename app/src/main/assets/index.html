<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gyvoji Drobė</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Simple animated pattern – "Gyvoji Drobė" (Living Canvas)
        let t = 0;
        function draw() {
            t += 0.02;
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            for (let i = 0; i < 12; i++) {
                const x = w / 2 + Math.cos(t + i * 0.5) * (w * 0.3);
                const y = h / 2 + Math.sin(t + i * 0.7) * (h * 0.3);
                const r = 30 + Math.sin(t + i) * 15;
                const hue = (t * 30 + i * 30) % 360;

                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue}, 80%, 60%, 0.6)`;
                ctx.fill();
            }

            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
